name: Update Talks

on:
  push:
    branches: [master]
    paths: [talks.json, .github/scripts/render-talks.mjs]
  pull_request:
    paths: [talks.json, .github/scripts/render-talks.mjs]
  workflow_dispatch:

jobs:
  # Pull requests: fail on an invalid talks.json, read-only.
  check:
    name: Check talks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render talks into README.md
        run: node .github/scripts/render-talks.mjs

  # master: regenerate README.md and commit it.
  update:
    name: Update talks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render talks into README.md
        run: node .github/scripts/render-talks.mjs
      - name: Commit README.md
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update talks in README.md"
          git pull --rebase
          git push
